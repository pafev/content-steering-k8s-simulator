apiVersion: v1
kind: Service
metadata:
  name: redis
spec:
  selector:
    app: redis
  ports:
  - name: redis
    port: 6379
    targetPort: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        args: ["--save", "", "--appendonly", "no"]
        ports:
        - containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: telemetry-service
spec:
  selector:
    app: telemetry-service
  ports:
  - name: http
    port: 30600
    targetPort: 30600
  - name: cdn-logs
    protocol: UDP
    port: 9000
    targetPort: 9000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: telemetry-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: telemetry-service
  template:
    metadata:
      labels:
        app: telemetry-service
    spec:
      containers:
      - name: telemetry
        image: pafev/content-steering:telemetry-service-latest
        imagePullPolicy: IfNotPresent
        env:
        - name: REDIS_URL
          value: redis://redis:6379/0
        ports:
        - containerPort: 30600
        - containerPort: 9000
          protocol: UDP
        readinessProbe:
          httpGet:
            path: /healthz
            port: 30600
          initialDelaySeconds: 2
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: steering-server
spec:
  selector:
    app: steering-server
  ports:
  - name: http
    protocol: TCP
    port: 30500
    targetPort: 30500
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: steering-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: steering-server
  template:
    metadata:
      labels:
        app: steering-server
    spec:
      automountServiceAccountToken: false
      containers:
      - name: steering
        image: pafev/content-steering:steering-server-latest
        imagePullPolicy: IfNotPresent
        env:
        - name: REDIS_URL
          value: redis://redis:6379/0
        ports:
        - containerPort: 30500
        readinessProbe:
          httpGet:
            path: /healthz
            port: 30500
          initialDelaySeconds: 2
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: origin-server
spec:
  selector:
    app: origin-server
  ports:
  - name: http
    port: 80
    targetPort: 80
---
apiVersion: v1
kind: Pod
metadata:
  name: origin-server
  labels:
    app: origin-server
spec:
  containers:
  - name: origin
    image: pafev/content-steering:origin-latest
    imagePullPolicy: IfNotPresent
    ports:
    - containerPort: 80
    volumeMounts:
    - name: bucket
      mountPath: /srv
      readOnly: true
  volumes:
  - name: bucket
    hostPath:
      path: /mnt/bucket
      type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: cdn-1
spec:
  selector:
    app: cdn-surrogate
    cdn-id: "1"
  ports:
  - name: http
    port: 80
    targetPort: 80
  - name: https
    port: 443
    targetPort: 443
---
apiVersion: v1
kind: Pod
metadata:
  name: cdn-1-edge-1
  labels:
    app: cdn-surrogate
    cdn-id: "1"
    pathway-id: cdn-1
spec:
  containers:
  - name: surrogate
    image: pafev/content-steering:cdn-latest
    imagePullPolicy: IfNotPresent
    env:
    - name: LATITUDE
      value: "-23.0"
    - name: LONGITUDE
      value: "-47.0"
    - name: PATHWAY_ID
      value: cdn-1
    ports:
    - containerPort: 80
    - containerPort: 443
    volumeMounts:
    - name: certs
      mountPath: /etc/nginx/certs
      readOnly: true
    - name: cache
      mountPath: /var/cache/nginx
  volumes:
  - name: certs
    secret:
      secretName: cdn-1-certs
  - name: cache
    emptyDir: {}
---
