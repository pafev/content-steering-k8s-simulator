# Shape CDN egress to player PodIPs (the media response direction).
# These are initial one-way delays; validate browser TTLB and reward order in a control.
apiVersion: net-chaos-simulator.pafev.dev/v1
kind: NetworkChaos
metadata:
  name: content-steering-cdn1-delay
  namespace: default
spec:
  sourceSelector:
    name: cdn-1-edge-1
  targetPodSelector:
    labels:
      matchLabels:
        app: dash-client
  delay: 4ms
---
apiVersion: net-chaos-simulator.pafev.dev/v1
kind: NetworkChaos
metadata:
  name: content-steering-cdn2-delay
  namespace: default
spec:
  sourceSelector:
    name: cdn-2-edge-1
  targetPodSelector:
    labels:
      matchLabels:
        app: dash-client
  delay: 12ms
---
apiVersion: net-chaos-simulator.pafev.dev/v1
kind: NetworkChaos
metadata:
  name: content-steering-cdn3-delay
  namespace: default
spec:
  sourceSelector:
    name: cdn-3-edge-1
  targetPodSelector:
    labels:
      matchLabels:
        app: dash-client
  delay: 9ms
