# QoE pilot: compromise between steering sensitivity and slow alternatives.
apiVersion: net-chaos-simulator.pafev.dev/v1
kind: NetworkChaos
metadata:
  name: content-steering-cdn1-delay
  namespace: default
spec:
  sourceSelector:
    name: cdn-1-edge-1
  targetPodSelector:
    labels:
      matchLabels:
        app: dash-client
  delay: 200ms
---
apiVersion: net-chaos-simulator.pafev.dev/v1
