events {
    worker_connections 1024;
}

http {
    server {
        listen 80 default_server;
        server_name _;

        location = / {
            default_type text/html;
            return 200 '<!doctype html><title>Content Steering simulator</title><h1>Content Steering simulator</h1><p>Read-only inspection:</p><ul><li><a href="/healthz">Gateway health</a></li><li><a href="/css/healthz">CSS health</a></li><li><a href="/telemetry/healthz">Telemetry health</a></li></ul><p>Run state: /state/&lt;run_id&gt;</p>';
        }

        location = /healthz {
            default_type application/json;
            return 200 '{"status":"ok"}';
        }

        location = /css/healthz {
            proxy_pass http://steering-server.default.svc.cluster.local:30500/healthz;
        }

        location = /telemetry/healthz {
            proxy_pass http://telemetry-service.default.svc.cluster.local:30600/healthz;
        }

        location /state/ {
            limit_except GET { deny all; }
            proxy_pass http://telemetry-service.default.svc.cluster.local:30600/v1/state/;
        }

        location / {
            return 404;
        }
    }
}
